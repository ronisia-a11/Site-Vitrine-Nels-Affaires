<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact – Pagne & Maison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main>
  <div class="entete">
    <div class="wrap">
      <h1>Contactez-nous</h1>
      <p class="lead">Décrivez votre projet, nous vous répondons avec un devis.</p>
    </div>
  </div>
  <section>
    <div class="wrap contact">
      <form id="form-contact">
        <div><label for="nom">Votre nom</label><input id="nom" name="nom" required></div>
        <div><label for="tel">Votre téléphone</label><input id="tel" name="tel" type="tel" required></div>
        <div>
          <label for="service">Service souhaité</label>
          <select id="service" name="service">
            <option>Conception de vêtements</option>
            <option>Tables murales</option>
            <option>Sacs</option>
            <option>Protections pour meubles</option>
            <option>Autre</option>
          </select>
        </div>
        <div><label for="message">Votre message</label><textarea id="message" name="message" required></textarea></div>
        <button class="btn" type="submit">Envoyer par WhatsApp</button>
        <p id="retour-form" role="status"></p>
      </form>

      <div class="coord">
        <h2>Nos coordonnées</h2>
        <p>Atelier à Douala. Appelez-nous ou écrivez-nous sur le réseau de votre choix.</p>
        <div class="coord" id="liens-contact"></div>
      </div>
    </div>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
